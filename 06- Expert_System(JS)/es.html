<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
</head>

<body>
    <div class="" container>
        <h3 style="font-family: 'Times New Roman', Times, serif; background-color: blue;">Hospital Management System
        </h3>
        <form action="">
            <fieldset>
                <legend>Symptoms:</legend>
                <input type="checkbox" name="fever" id="fever">
                <label for="fever">Fever</label>
                <input type="checkbox" name="headache" id="headache">
                <label for="headache">Head Ache</label>
                <input type="checkbox" name="Cough" id="cough">
                <label for="cough">Cough</label>
                <input type="checkbox" name="StomachAche" id="stomachache">
                <label for="stomachache">Stomach Ache</label>
                <input type="checkbox" name="chestPain" id="chestpain">
                <label for="chestpain">Chest Pain</label>
                <button type="button" onclick="analyzeSymptoms()">Analyze Symptoms</button>
            </fieldset>
        </form>
    </div>
    <div id="result" class="result">Results are here: <br></div>
    <script src="script.js"></script>
</body>

</html>

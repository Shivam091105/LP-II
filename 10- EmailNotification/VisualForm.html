<apex:page controller="EmailController">

    <apex:form>

        <apex:pageBlock title="Email Notification System">

            <!-- Messages -->
            <apex:pageMessages />

            <!-- Input Fields -->
            <apex:pageBlockSection columns="1">

                <apex:inputText value="{!toAddress}" label="Recipient Email" />

                <apex:inputText value="{!subject}" label="Subject" />

                <apex:inputTextarea value="{!body}" label="Message Body" rows="5" />

            </apex:pageBlockSection>

            <!-- Button -->
            <apex:pageBlockButtons>

                <apex:commandButton value="Send Email" action="{!sendEmail}" />

            </apex:pageBlockButtons>

        </apex:pageBlock>

    </apex:form>

</apex:page>
